name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m tracker.validate data

  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Link and quote checks on changed records
        run: |
          git fetch origin main
          python -m tracker.checks --changed --base origin/main --data data

  tier:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'official-record')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Classify changed paths and enable auto-merge for official records
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin main
          TIER=$(git diff --name-status --no-renames origin/main...HEAD | python -m tracker.tier)
          echo "tier=$TIER"
          if [ "$TIER" = "official" ]; then
            gh pr merge --auto --squash "$PR_NUMBER"
          else
            # Auto-merge stays armed across pushes, so a later judgment change must turn it off.
            gh pr merge --disable-auto "$PR_NUMBER" || true
            echo "Not official-only; leaving for owner review."
          fi
