name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m tracker.validate data

  tier:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'official-record')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Classify changed paths and enable auto-merge for official records
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin main
          TIER=$(git diff --name-only origin/main...HEAD | python -m tracker.tier)
          echo "tier=$TIER"
          if [ "$TIER" = "official" ]; then
            gh pr merge --auto --squash "$PR_NUMBER"
          else
            echo "Not official-only; leaving for owner review."
          fi
