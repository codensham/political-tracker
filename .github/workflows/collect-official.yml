name: Collect official records

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run official collectors
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          python -m tracker.candidates
          python -m tracker.collectors fec_finance
          python -m tracker.collectors voteview
          python -m tracker.collectors federal_register
          python -m tracker.validate data
      - name: Compute date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Open or update the official-records pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT or GitHub App token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN
          # do not trigger the CI workflow, so auto-merge would never proceed.
          token: ${{ secrets.BOT_TOKEN }}
          branch: collect/official
          title: "Official records update ${{ steps.date.outputs.date }}"
          commit-message: "Official records update"
          labels: official-record
          add-paths: data
