name: Collect articles

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Collect outlet feeds
        id: rss
        run: |
          # One batched PR on collect/articles. A feed failure is recorded and the run continues,
          # so the PR holds whatever succeeded (spec §6, D-023). The last step fails the workflow.
          FAILURES="$RUNNER_TEMP/rss-failures.txt"
          : > "$FAILURES"
          python -m tracker.collectors rss || echo "rss" >> "$FAILURES"
      - name: Validate records
        id: validate
        run: python -m tracker.validate data
      - name: Compute date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Open or update the articles pull request
        if: always() && steps.validate.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT or GitHub App token, not GITHUB_TOKEN, so CI runs on the bot's pull request.
          token: ${{ secrets.BOT_TOKEN }}
          branch: collect/articles
          title: "Article collection ${{ steps.date.outputs.date }}"
          commit-message: "Article collection"
          add-paths: data
      - name: Fail if the feed collector failed
        if: always()
        run: |
          FAILURES="$RUNNER_TEMP/rss-failures.txt"
          if [ -s "$FAILURES" ]; then
            echo "Collectors that failed:"
            cat "$FAILURES"
            exit 1
          fi
