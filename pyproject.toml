[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "political-tracker"
version = "0.1.0"
description = "Open, sourced reference data on US presidential candidates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.21",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
